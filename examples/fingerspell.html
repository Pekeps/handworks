<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>handworks — fingerspell</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="layout">
    <div class="panel">
      <h1>Fingerspell</h1>
      <p class="muted"><a href="./index.html">← demos</a></p>
      <h2>Text</h2>
      <input type="text" id="text" value="HELLO WORLD" maxlength="60" />
      <div class="row" style="margin-top: 8px">
        <label>speed</label>
        <input type="range" id="speed" min="0.5" max="4" step="0.1" value="1.5" />
        <output id="speedOut">1.5</output>
      </div>
      <div style="margin-top: 12px" class="grid">
        <button class="primary" id="play">Spell it</button>
        <button id="stop">Stop</button>
      </div>
      <p class="muted" style="margin-top: 16px">
        ASL fingerspelling: letters A–Z and digits 0–9. Repeated letters get a
        small bounce, spaces relax the hand.
      </p>
    </div>
    <div class="stage" id="stage"><div class="letter" id="letter"></div></div>
  </div>
  <script type="module" src="./fingerspell.ts"></script>
</body>
</html>
